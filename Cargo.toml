[package]
name = "atlas-dmg"
version = "26.0.2-a"
edition = "2024"
rust-version = "1.88"
license = "MIT OR Apache-2.0"
description = "Read Apple disk images (UDIF .dmg): zlib, bzip2, LZFSE, LZMA and ADC chunks, plus a bounded property list parser."
repository = "https://github.com/05Narwhal/atlas-dmg"
documentation = "https://disk-atlas.julianloy.com/docs"
readme = "README.md"
keywords = ["dmg", "udif", "disk-image", "macos", "parser"]
categories = ["filesystem", "parser-implementations"]
authors = ["Julian A. Loy"]

[features]
# Image builders and test property lists, for crates that test against this one.
test-util = ["dep:lzma-rs", "dep:lzfse_rust"]

[dependencies]
atlas-fs-core = { version = "26.0.2-a", path = "../atlas-fs-core" }
atlas-hfsplus = { version = "26.0.2-a", path = "../atlas-hfsplus" }
# Property lists (XML).
quick-xml = "0.41"
base64 = "0.22"
# UDIF bzip2 chunks.
bzip2 = "0.6"
# UDIF zlib chunks.
miniz_oxide = "0.8"
# Encodes xz streams for the test image builder (`test-util` only).
lzma-rs = { version = "0.3", optional = true }
# Encodes LZFSE chunks for the test image builder (`test-util` only).
lzfse_rust = { version = "0.2", optional = true }

[dev-dependencies]
# Encodes xz streams for the test image builder.
lzma-rs = "0.3"
# Encodes LZFSE chunks for the test image builder.
lzfse_rust = "0.2"

[lints.rust]
unsafe_code = "forbid"
unused_must_use = "deny"
rust_2018_idioms = { level = "warn", priority = -1 }

[lints.clippy]
all = { level = "warn", priority = -1 }
dbg_macro = "warn"
todo = "warn"
print_stdout = "warn"
print_stderr = "warn"
undocumented_unsafe_blocks = "deny"
